name: TypeScript core parity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: |
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test tests/core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv sync --locked
      - name: Compare legacy and persistent Node/Bun cores
        run: |
          uv run python tests/core/parity.py --bun (Get-Command bun).Source --output f3-parity.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report=Get-Content f3-parity.json -Raw | ConvertFrom-Json
          uv run python tests/core/contracts-probe.py (Join-Path $report.artifacts 'data/libraries')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f3-${{ matrix.os }}
          path: f3-parity.json
