name: Bun runtime and Node reference
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: |
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun test tests/core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare retained Node and Bun corpus
        run: |
          node tests/tooling/retirement-parity.mjs (Get-Command bun).Source retirement-parity.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retirement-${{ matrix.os }}
          path: retirement-parity.json
      - name: Verify F4/F5 installed Bun package and SDK clients
        run: |
          npm ci --prefix tests/tooling --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report=Get-Content retirement-parity.json -Raw | ConvertFrom-Json
          ./tests/tooling/package-probe.ps1 -Bun (Get-Command bun).Source -Libraries (Join-Path $report.artifacts 'data/libraries')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f4-source-${{ matrix.os }}
          path: docs/architecture/007-bun-mcp.md
