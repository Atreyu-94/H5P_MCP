name: Test packaged MCP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python tests/check_repository.py
      - run: uv build
      - name: Test installed wheel with isolated libraries
        env:
          H5P_MCP_ISOLATED_TESTS: '1'
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv pip install --reinstall $wheel
          $python = if ($IsWindows) { Join-Path $pwd '.venv/Scripts/python.exe' } else { Join-Path $pwd '.venv/bin/python' }
          $tests = Join-Path $env:RUNNER_TEMP 'h5p-tests'
          Copy-Item tests $tests -Recurse
          Set-Location $env:RUNNER_TEMP
          & $python -m pytest $tests -q
