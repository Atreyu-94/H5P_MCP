name: Frozen Python rollback verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 93060c52195bde9b590dba11e533bdedba3d2cc1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python tests/check_repository.py
      - run: uv build
      - name: Test installed wheel with isolated libraries
        env:
          H5P_MCP_ISOLATED_TESTS: '1'
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv pip install --reinstall $wheel
          $python = if ($IsWindows) { Join-Path $pwd '.venv/Scripts/python.exe' } else { Join-Path $pwd '.venv/bin/python' }
          $tests = Join-Path $env:RUNNER_TEMP 'h5p-tests'
          Copy-Item tests $tests -Recurse
          Set-Location $env:RUNNER_TEMP
          & $python -m pytest $tests -q
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 93060c52195bde9b590dba11e533bdedba3d2cc1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Install pinned browser tooling
        run: |
          npm ci --prefix tests/tooling --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/tooling/node_modules/@playwright/test/cli.js install --with-deps chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify math feedback and grading on pinned Core
        env:
          H5P_MCP_BROWSER_CHANNEL: chromium
        run: ./tests/tooling/browser-baseline.ps1 -OutputPath browser-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-grading
          path: browser-report.json
