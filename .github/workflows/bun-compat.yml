name: Frozen Python runtime compatibility oracle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime-subset:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
        node: ['22.12.0', '24.21.0']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 93060c52195bde9b590dba11e533bdedba3d2cc1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: uv sync --locked
      - name: Verify official Bun archive and installed binary hashes
        run: ./tests/runtime-compat/verify-bun.ps1 -BunPath (Get-Command bun).Source -OutputPath b0-bun-identity.json
      - name: Verify TypeScript 7 and Oxlint without ESLint or TypeScript 6
        run: |
          npm ci --prefix tests/tooling --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/tooling/verify-toolchain.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun tests/tooling/verify-toolchain.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/tooling/node_modules/oxlint/bin/oxlint --deny-warnings h5p_mcp/lumi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare runtime subset on identical npm dependencies
        run: |
          if ($IsMacOS -and [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'The macOS gate requires an arm64 runner; this runner cannot certify it.'
          }
          $bun = (Get-Command bun).Source
          uv run python tests/runtime-compat/runtime-probe.py --bun $bun --output b0-runtime.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compare frozen Bun install and rerun corpus on its dependency tree
        run: |
          $bun = (Get-Command bun).Source
          uv run python tests/runtime-compat/installer-probe.py --bun $bun --runtime-report b0-runtime.json --output b0-installer.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python tests/runtime-compat/runtime-probe.py --bun $bun --installer-report b0-installer.json --output b0-bun-tree.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify process protocol and stream lifecycle
        run: |
          $bun = (Get-Command bun).Source
          uv run python tests/runtime-compat/process-probe.py --bun $bun --runtime-report b0-runtime.json --output b0-process.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: b0-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            b0-runtime.json
            b0-installer.json
            b0-installer.bun.lock
            b0-bun-tree.json
            b0-process.json
            b0-bun-identity.json
